<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CNCF Project Adoption Metrics Dashboard</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <!-- Sidebar navigation -->
    <aside id="side">
      <div class="brand">
        <img src="favicon.svg" width="30" alt="" />
        CNCF Metrics
      </div>

      <nav>
        <a href="#dashboard">Dashboard</a>
        <a href="#explorer">Project Explorer</a>
        <a href="#analytics">Analytics</a>
        <a href="#compare">Compare <b id="cc"></b></a>
        <a href="#monitoring">Monitoring</a>
      </nav>

      <p class="note">Data is an approximate snapshot, not live GitHub data.</p>
    </aside>

    <!-- Main content area -->
    <main>
      <header>
        <button id="menu" aria-label="Toggle menu">☰</button>
        <h1 id="title"></h1>
        <input
          id="gs"
          type="search"
          placeholder="Search projects by name…"
          aria-label="Search projects"
        />
      </header>

      <!-- app.js renders each page into this container -->
      <div id="view"></div>
    </main>

    <!-- Project details popup, filled by app.js -->
    <div id="modal" hidden></div>

    <script src="vendor/chart.umd.js"></script>
    <script src="app.js"></script>
  </body>
</html>
